<g font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace"><g opacity="0"><set attributeName="opacity" to="1" begin="0.29s" fill="freeze"/><text x="30.0" y="68.0" font-size="14" fill="#ffffff" font-weight="700" textLength="84.0" lengthAdjust="spacing" xml:space="preserve">XCRPTY7(1)</text><text x="500.0" y="68.0" font-size="14" fill="#9d9d9d" text-anchor="middle" textLength="193.2" lengthAdjust="spacing" xml:space="preserve">General Commands Manual</text><text x="970.0" y="68.0" font-size="14" fill="#ffffff" font-weight="700" text-anchor="end" textLength="84.0" lengthAdjust="spacing" xml:space="preserve">XCRPTY7(1)</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="0.36s" fill="freeze"/><text x="30.0" y="110.0" font-size="14" fill="#ffffff" font-weight="700" textLength="33.6" lengthAdjust="spacing" xml:space="preserve">NAME</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="0.39s" fill="freeze"/><text x="30.0" y="131.0" font-size="14" fill="#e6e6e6" textLength="58.8" lengthAdjust="spacing" xml:space="preserve">       </text><text x="88.8" y="131.0" font-size="14" fill="#ffffff" font-weight="700" textLength="58.8" lengthAdjust="spacing" xml:space="preserve">xcrpty7</text><text x="147.6" y="131.0" font-size="14" fill="#e6e6e6" textLength="504.0" lengthAdjust="spacing" xml:space="preserve"> - full-stack &amp; AI-agent developer from Tashkent, Uzbekistan</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="0.46s" fill="freeze"/><text x="30.0" y="173.0" font-size="14" fill="#ffffff" font-weight="700" textLength="67.2" lengthAdjust="spacing" xml:space="preserve">SYNOPSIS</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="0.50s" fill="freeze"/><text x="30.0" y="194.0" font-size="14" fill="#e6e6e6" textLength="58.8" lengthAdjust="spacing" xml:space="preserve">       </text><text x="88.8" y="194.0" font-size="14" fill="#ffffff" font-weight="700" textLength="58.8" lengthAdjust="spacing" xml:space="preserve">xcrpty7</text><text x="147.6" y="194.0" font-size="14" fill="#9d9d9d" textLength="16.8" lengthAdjust="spacing" xml:space="preserve"> [</text><text x="164.4" y="194.0" font-size="14" fill="#ffffff" font-weight="700" textLength="50.4" lengthAdjust="spacing" xml:space="preserve">--idea</text><text x="214.8" y="194.0" font-size="14" fill="#e6e6e6" textLength="8.4" lengthAdjust="spacing" xml:space="preserve"> </text><text x="223.2" y="194.0" font-size="14" fill="#e6e6e6" textLength="33.6" lengthAdjust="spacing" xml:space="preserve" text-decoration="underline">text</text><text x="256.8" y="194.0" font-size="14" fill="#9d9d9d" textLength="25.2" lengthAdjust="spacing" xml:space="preserve">] [</text><text x="282.0" y="194.0" font-size="14" fill="#ffffff" font-weight="700" textLength="84.0" lengthAdjust="spacing" xml:space="preserve">--deadline</text><text x="366.0" y="194.0" font-size="14" fill="#e6e6e6" textLength="8.4" lengthAdjust="spacing" xml:space="preserve"> </text><text x="374.4" y="194.0" font-size="14" fill="#e6e6e6" textLength="33.6" lengthAdjust="spacing" xml:space="preserve" text-decoration="underline">3-7d</text><text x="408.0" y="194.0" font-size="14" fill="#9d9d9d" textLength="25.2" lengthAdjust="spacing" xml:space="preserve">] [</text><text x="433.2" y="194.0" font-size="14" fill="#ffffff" font-weight="700" textLength="50.4" lengthAdjust="spacing" xml:space="preserve">--lang</text><text x="483.6" y="194.0" font-size="14" fill="#e6e6e6" textLength="8.4" lengthAdjust="spacing" xml:space="preserve"> </text><text x="492.0" y="194.0" font-size="14" fill="#e6e6e6" textLength="67.2" lengthAdjust="spacing" xml:space="preserve" text-decoration="underline">uz|ru|en</text><text x="559.2" y="194.0" font-size="14" fill="#9d9d9d" textLength="16.8" lengthAdjust="spacing" xml:space="preserve">] </text><text x="576.0" y="194.0" font-size="14" fill="#ffffff" font-weight="700" textLength="33.6" lengthAdjust="spacing" xml:space="preserve">ship</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="0.57s" fill="freeze"/><text x="30.0" y="236.0" font-size="14" fill="#ffffff" font-weight="700" textLength="92.4" lengthAdjust="spacing" xml:space="preserve">DESCRIPTION</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="0.60s" fill="freeze"/><text x="30.0" y="257.0" font-size="14" fill="#e6e6e6" textLength="58.8" lengthAdjust="spacing" xml:space="preserve">       </text><text x="88.8" y="257.0" font-size="14" fill="#e6e6e6" textLength="747.6" lengthAdjust="spacing" xml:space="preserve">Builds AI agents that live in Telegram and do real work: chats, databases, APIs, reports.</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="0.64s" fill="freeze"/><text x="30.0" y="278.0" font-size="14" fill="#e6e6e6" textLength="58.8" lengthAdjust="spacing" xml:space="preserve">       </text><text x="88.8" y="278.0" font-size="14" fill="#e6e6e6" textLength="680.4" lengthAdjust="spacing" xml:space="preserve">The model talks, the code decides, and nothing is sent without your explicit yes.</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="0.67s" fill="freeze"/><text x="30.0" y="299.0" font-size="14" fill="#e6e6e6" textLength="58.8" lengthAdjust="spacing" xml:space="preserve">       </text><text x="88.8" y="299.0" font-size="14" fill="#e6e6e6" textLength="730.8" lengthAdjust="spacing" xml:space="preserve">Ships web apps with auth, payments and admin panels that real businesses use every day.</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="0.71s" fill="freeze"/><text x="30.0" y="320.0" font-size="14" fill="#e6e6e6" textLength="58.8" lengthAdjust="spacing" xml:space="preserve">       </text><text x="88.8" y="320.0" font-size="14" fill="#e6e6e6" textLength="470.4" lengthAdjust="spacing" xml:space="preserve">Writes code since 14. Speaks Uzbek, Russian and English.</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="0.78s" fill="freeze"/><text x="30.0" y="362.0" font-size="14" fill="#ffffff" font-weight="700" textLength="58.8" lengthAdjust="spacing" xml:space="preserve">OPTIONS</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="0.81s" fill="freeze"/><text x="30.0" y="383.0" font-size="14" fill="#e6e6e6" textLength="58.8" lengthAdjust="spacing" xml:space="preserve">       </text><text x="88.8" y="383.0" font-size="14" fill="#ffffff" font-weight="700" textLength="134.4" lengthAdjust="spacing" xml:space="preserve">--mvp           </text><text x="223.2" y="383.0" font-size="14" fill="#e6e6e6" textLength="403.2" lengthAdjust="spacing" xml:space="preserve">MVP in 3-7 days; polish once real users touch it</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="0.85s" fill="freeze"/><text x="30.0" y="404.0" font-size="14" fill="#e6e6e6" textLength="58.8" lengthAdjust="spacing" xml:space="preserve">       </text><text x="88.8" y="404.0" font-size="14" fill="#ffffff" font-weight="700" textLength="134.4" lengthAdjust="spacing" xml:space="preserve">--secure        </text><text x="223.2" y="404.0" font-size="14" fill="#e6e6e6" textLength="470.4" lengthAdjust="spacing" xml:space="preserve">validated input, parameterized SQL, secrets only in .env</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="0.88s" fill="freeze"/><text x="30.0" y="425.0" font-size="14" fill="#e6e6e6" textLength="58.8" lengthAdjust="spacing" xml:space="preserve">       </text><text x="88.8" y="425.0" font-size="14" fill="#ffffff" font-weight="700" textLength="134.4" lengthAdjust="spacing" xml:space="preserve">--code-decides  </text><text x="223.2" y="425.0" font-size="14" fill="#e6e6e6" textLength="453.6" lengthAdjust="spacing" xml:space="preserve">the LLM proposes; the code checks, limits and executes</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="0.92s" fill="freeze"/><text x="30.0" y="446.0" font-size="14" fill="#e6e6e6" textLength="58.8" lengthAdjust="spacing" xml:space="preserve">       </text><text x="88.8" y="446.0" font-size="14" fill="#ffffff" font-weight="700" textLength="134.4" lengthAdjust="spacing" xml:space="preserve">--measured      </text><text x="223.2" y="446.0" font-size="14" fill="#e6e6e6" textLength="310.8" lengthAdjust="spacing" xml:space="preserve">no test or number behind it, no claim</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="0.99s" fill="freeze"/><text x="30.0" y="488.0" font-size="14" fill="#ffffff" font-weight="700" textLength="33.6" lengthAdjust="spacing" xml:space="preserve">BUGS</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="1.02s" fill="freeze"/><text x="30.0" y="509.0" font-size="14" fill="#e6e6e6" textLength="58.8" lengthAdjust="spacing" xml:space="preserve">       </text><text x="88.8" y="509.0" font-size="14" fill="#e6e6e6" textLength="588.0" lengthAdjust="spacing" xml:space="preserve">Each mistake happens only once: every solved bug is written to memory.</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="1.09s" fill="freeze"/><text x="30.0" y="551.0" font-size="14" fill="#ffffff" font-weight="700" textLength="67.2" lengthAdjust="spacing" xml:space="preserve">SEE ALSO</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="1.13s" fill="freeze"/><text x="30.0" y="572.0" font-size="14" fill="#e6e6e6" textLength="58.8" lengthAdjust="spacing" xml:space="preserve">       </text><text x="88.8" y="572.0" font-size="14" fill="#ffffff" font-weight="700" textLength="67.2" lengthAdjust="spacing" xml:space="preserve">telegram</text><text x="156.0" y="572.0" font-size="14" fill="#9d9d9d" textLength="159.6" lengthAdjust="spacing" xml:space="preserve">(1) t.me/xcrpty7,  </text><text x="315.6" y="572.0" font-size="14" fill="#ffffff" font-weight="700" textLength="67.2" lengthAdjust="spacing" xml:space="preserve">ai-tutor</text><text x="382.8" y="572.0" font-size="14" fill="#9d9d9d" textLength="134.4" lengthAdjust="spacing" xml:space="preserve">(7) live demo,  </text><text x="517.2" y="572.0" font-size="14" fill="#ffffff" font-weight="700" textLength="50.4" lengthAdjust="spacing" xml:space="preserve">github</text><text x="567.6" y="572.0" font-size="14" fill="#9d9d9d" textLength="92.4" lengthAdjust="spacing" xml:space="preserve">(1) xcrpty7</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="1.20s" fill="freeze"/><text x="30.0" y="614.0" font-size="14" fill="#9d9d9d" textLength="126.0" lengthAdjust="spacing" xml:space="preserve">xcrpty7 2026.11</text><text x="500.0" y="614.0" font-size="14" fill="#9d9d9d" text-anchor="middle" textLength="100.8" lengthAdjust="spacing" xml:space="preserve">Tashkent, UZ</text><text x="970.0" y="614.0" font-size="14" fill="#ffffff" font-weight="700" text-anchor="end" textLength="84.0" lengthAdjust="spacing" xml:space="preserve">XCRPTY7(1)</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="1.40s" fill="freeze"/><rect x="24" y="641" width="487" height="22" fill="#e6e6e6"/><text x="26.0" y="657.0" font-size="14" fill="#000000" font-weight="700" textLength="478.8" lengthAdjust="spacing" xml:space="preserve"> Manual page xcrpty7(1) line 1/27 (END) (press q to quit)</text><rect class="cur" x="517" y="643" width="8.4" height="18" fill="#ffffff"/></g></g>
