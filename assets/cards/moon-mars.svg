<svg xmlns="http://www.w3.org/2000/svg" width="980" height="228" viewBox="0 0 980 228" role="img" fill="none"><title>Moon &amp; Mars on Earth: Interactive atlas of places on Earth that stand in for lunar and Martian conditions. Similarity is computed, not claimed: a six-criteria index from open data with a source behind every score. 3D globe, reverse search from a Mars target, side-by-side Earth/Mars maps, offline mode.</title><style>.streak{opacity:1;animation:run 7s linear infinite}
@keyframes run{from{stroke-dashoffset:0}to{stroke-dashoffset:-2416}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs>
<linearGradient id="bg-moon-mars" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121a26"/><stop offset="1" stop-color="#0f1620"/></linearGradient>
<linearGradient id="streak-moon-mars" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0883e"/><stop offset="1" stop-color="#39d0d8"/></linearGradient>
<radialGradient id="halo-moon-mars" cx="1" cy="0" r="0.8"><stop offset="0" stop-color="#f0883e" stop-opacity="0.16"/><stop offset="1" stop-color="#f0883e" stop-opacity="0"/></radialGradient>
</defs>
<rect x="1" y="1" width="978" height="226" rx="16" fill="url(#bg-moon-mars)" stroke="#253041" stroke-width="1.5"/>
<rect x="1" y="1" width="978" height="226" rx="16" fill="url(#halo-moon-mars)"/>
<rect class="streak" x="1" y="1" width="978" height="226" rx="16" stroke="url(#streak-moon-mars)" stroke-width="2.5"
 stroke-dasharray="140 2416" stroke-linecap="round" opacity="0"/>
<rect x="24" y="24" width="46" height="46" rx="12" fill="#0d1117" stroke="#253041"/>
<text x="47" y="56" text-anchor="middle" font-family="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif" font-size="24" fill="#fff">🪐</text>
<text x="84" y="47" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#e6edf3">Moon &amp; Mars on Earth</text>
<text x="84" y="68" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#f0883e">30 Earth sites · 18 Moon/Mars targets · 6 criteria</text>
<rect x="835" y="28" width="121" height="22" rx="11" fill="#f0883e" fill-opacity="0.12" stroke="#f0883e" stroke-opacity="0.55"/>
<text x="896" y="43" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" letter-spacing="1" fill="#f0883e">NASA SPACE APPS</text>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14.5" fill="#c9d1d9"><text x="24" y="104">Interactive atlas of places on Earth that stand in for lunar and Martian conditions. Similarity is computed, not</text><text x="24" y="125">claimed: a six-criteria index from open data with a source behind every score. 3D globe, reverse search from a</text><text x="24" y="146">Mars target, side-by-side Earth/Mars maps, offline mode.</text></g>
<rect x="24" y="184" width="56" height="24" rx="12" fill="#0d1117" stroke="#253041"/><text x="52" y="200.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#8b949e">React</text><rect x="88" y="184" width="157" height="24" rx="12" fill="#0d1117" stroke="#253041"/><text x="166" y="200.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#8b949e">three.js / globe.gl</text><rect x="253" y="184" width="78" height="24" rx="12" fill="#0d1117" stroke="#253041"/><text x="292" y="200.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#8b949e">MapLibre</text><rect x="338" y="184" width="70" height="24" rx="12" fill="#0d1117" stroke="#253041"/><text x="374" y="200.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#8b949e">Express</text><rect x="417" y="184" width="70" height="24" rx="12" fill="#0d1117" stroke="#253041"/><text x="452" y="200.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#8b949e">MongoDB</text><rect x="495" y="184" width="42" height="24" rx="12" fill="#0d1117" stroke="#253041"/><text x="516" y="200.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#8b949e">Zod</text><rect x="545" y="184" width="114" height="24" rx="12" fill="#0d1117" stroke="#253041"/><text x="602" y="200.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#8b949e">12 unit tests</text></svg>
