<svg xmlns="http://www.w3.org/2000/svg" width="980" height="236" viewBox="0 0 980 236" role="img" fill="none"><title>Moon &amp; Mars on Earth: Interactive atlas of places on Earth that stand in for lunar and Martian conditions. Similarity is computed, not claimed: a six-criteria index from open data with a source behind every score. 3D globe, reverse search from a Mars target, side-by-side Earth/Mars maps, offline mode.</title><style>.streak{opacity:1;animation:run 8s linear infinite}
